name: Basket CSV audit

on:
  pull_request:
    paths:
      - 'scripts/basket_audit.py'
      - 'tests/test_basket_audit.py'
      - 'urunler.csv'
      - '.github/workflows/basket-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_basket_audit.py' -v
      - name: Syntax check
        run: python -m py_compile scripts/basket_audit.py tests/test_basket_audit.py
      - name: Audit bundled basket without network
        run: python scripts/basket_audit.py --json
