name: Signal export tests
on:
  push:
    paths:
      - 'export_signals.py'
      - 'tests/test_export_signals.py'
      - '.github/workflows/signal-export.yml'
  pull_request:
    paths:
      - 'export_signals.py'
      - 'tests/test_export_signals.py'
      - '.github/workflows/signal-export.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_export_signals.py' -v
      - run: python -m py_compile export_signals.py tests/test_export_signals.py
